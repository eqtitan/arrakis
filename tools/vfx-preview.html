<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFX Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; color: #ddd; font: 12px/1.3 system-ui, sans-serif; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; }
  #ui { position: absolute; top: 6px; left: 6px; right: 6px; display: flex; gap: 3px; flex-wrap: wrap; align-items: center;
        background: rgba(0,0,0,.55); padding: 4px 6px; border-radius: 4px; }
  #ui button, #ui select { font: inherit; background: #333; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 2px 6px; }
  #ui button.on { background: #6a5acd; color: #fff; }
  #info { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 4px; white-space: pre; }
  body.clean #ui, body.clean #info { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/examples/jsm/": "../node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <select id="tier"><option>Ultra</option><option selected>High</option><option>Medium</option><option>Low</option></select>
  <select id="speed"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option></select>
  <span id="els"></span>
  <span id="fx"></span>
  <label><input type="checkbox" id="loop" checked> loop</label>
</div>
<div id="info"></div>
<script type="module" src="./vfx-preview.mjs"></script>
</body>
</html>
