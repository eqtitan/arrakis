name: Sigilbound Unity

on:
  push:
    paths: ["unity/**", ".github/workflows/sigilbound-unity.yml"]
  pull_request:
    paths: ["unity/**", ".github/workflows/sigilbound-unity.yml"]
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build an Android APK (needs UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE secrets)"
        type: boolean
        default: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run game-core checks
        run: dotnet run --project unity/Tests~

  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: unity-library-android-${{ hashFiles('unity/Assets/**', 'unity/Packages/**') }}
          restore-keys: unity-library-android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: Android
          buildMethod: Sigilbound.EditorTools.BuildScript.Android
      - uses: actions/upload-artifact@v4
        with:
          name: sigilbound-android
          path: unity/Builds/Android
